[project]
name = "geoservice"
version = "0.1.0"
description = "A geoservice app that buffers geometry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "shapely",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff>=0.16.0",
    "pre-commit>=4.6.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.ruff.format]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"
