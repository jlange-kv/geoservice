[project]
name = "geoservice"
version = "0.1.0"
description = "A geoservice app that buffers geometry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "shapely",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.ruff.format]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
