default_install_hook_types: [pre-commit]

repos:
  - repo: local # ruff runs from the project venv, not from a pre-commit-managed copy
    hooks:
      - id: ruff-check
        name: ruff check (project venv)
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format (project venv)
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml              # your own config file is YAML — it checks itself
      - id: check-merge-conflict    # catches committed `<<<<<<<` markers
      - id: check-added-large-files # the 200 MB shapefile you did not mean to add

  - repo: https://github.com/gitleaks/gitleaks
    rev: "v8.30.0"
    hooks:
      - id: gitleaks
